# MILI agent registry.
#
# This is the single source of truth for "which agents exist and who owns
# what" — MILI reads this instead of hardcoding seat names, which is what
# lets the roster grow from 8 to 60+ entries without touching mili.py,
# base.py, or any existing agent file.
#
# Fields:
#   id        - unique key, matches Agent.seat in agents/base.py subclasses
#   module    - python import path
#   class     - class name inside that module
#   parent    - "mili" for a top-level seat, or another agent's id for a
#               sub-agent (not used yet — reserved for the 60+ phase)
#   status    - active | draft | disabled
#   docs      - path to the role contract in docs/roles/
#   default_tier - default approval tier per docs/03-governance-and-escalation.md
#                  (1=autonomous, 2=notify, 3=human sign-off)

orchestrator:
  id: mili
  module: agents.mili
  class: MILI
  parent: null
  status: active
  docs: null

human_agents:
  - id: founder
    name: Ramich Uddin
    role: Founder / Final Approver
    status: active
    docs: docs/roles/human-founder.md
    approval_tier: 3
    notes: >
      Human-in-the-loop for every Tier 3 (Human Sign-off) decision across all
      seats — finance, hr_recruiting, and any Tier-2 seat escalation that
      fails its confidence gate. Not an AI seat; does not run SOPs.

agents:
  - id: support
    module: agents.support_agent
    class: SupportAgent
    parent: mili
    status: active
    docs: docs/roles/ai-support.md
    default_tier: 1

  - id: sales
    module: agents.sales_agent
    class: SalesAgent
    parent: mili
    status: active
    docs: docs/roles/ai-sales.md
    default_tier: 2

  - id: marketing
    module: agents.marketing_agent
    class: MarketingAgent
    parent: mili
    status: active
    docs: docs/roles/ai-marketing.md
    default_tier: 2

  - id: operations
    module: agents.operations_agent
    class: OperationsAgent
    parent: mili
    status: active
    docs: docs/roles/ai-operations.md
    default_tier: 2

  - id: finance
    module: agents.finance_agent
    class: FinanceAgent
    parent: mili
    status: active
    docs: docs/roles/ai-finance.md
    default_tier: 3

  - id: hr_recruiting
    module: agents.hr_recruiting_agent
    class: HRRecruitingAgent
    parent: mili
    status: active
    docs: docs/roles/ai-hr-recruiting.md
    default_tier: 3

  - id: product_research
    module: agents.product_research_agent
    class: ProductResearchAgent
    parent: mili
    status: active
    docs: docs/roles/ai-product-research.md
    default_tier: 2

  - id: list_building
    module: agents.list_building_agent
    class: ListBuildingAgent
    parent: mili
    status: active
    docs: docs/roles/ai-list-building.md
    default_tier: 2

  - id: digital_product
    module: agents.digital_product_agent
    class: DigitalProductAgent
    parent: mili
    status: active
    docs: docs/roles/ai-digital-product.md
    default_tier: 3

